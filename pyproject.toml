[project]
name = "price-aware-thermostat"
version = "0.1.0"
requires-python = ">=3.14.2,<3.15"

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:respx"
pythonpath = ["."]
testpaths = ["tests/integration"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
follow_imports = "silent"
files = ["custom_components/price_aware_thermostat"]
show_error_codes = true

[dependency-groups]
dev = [
  "homeassistant==2026.11.0",
  "pytest-homeassistant==2026.11.0",
  "pytest-cov>=6,<8",
  "ruff>=0.14,<1",
  "mypy>=1.18,<2",
]

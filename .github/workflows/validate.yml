name: Validate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  hacs:
    # Validate this public custom repository. Running this check does not
    # submit it to the default catalog or publish a release.
    if: ${{ github.event.repository.visibility == 'public' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Intentionally unpinned (@main / @master): both projects document these
      # refs and track current validation rules. Trade-off: upstream changes can
      # alter results without a change here; pin to a SHA if that is unwanted.
      - uses: hacs/action@main
        with:
          category: integration
          # No pull-request write permission; keep contents: read sufficient.
          comment: false

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

name: Home Assistant compatibility

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Home Assistant and test helpers
        run: python -m pip install "homeassistant==2026.11.0" "pytest-homeassistant==2026.11.0" "pytest-cov>=6,<8" ruff "mypy>=1.18,<2"
      - name: Compile the integration
        run: python -m compileall -q custom_components/price_aware_thermostat
      - name: Import integration modules against actual Home Assistant
        run: |
          python - <<'PY'
          from custom_components.price_aware_thermostat import async_setup_entry
          from custom_components.price_aware_thermostat.config_flow import PriceAwareThermostatConfigFlow
          from custom_components.price_aware_thermostat.climate import PriceAwareThermostat
          from custom_components.price_aware_thermostat.coordinator import NordPoolPriceCoordinator
          print("Home Assistant import checks passed")
          PY
      - name: Run all tests and measure integration coverage
        run: pytest -q tests --cov=custom_components.price_aware_thermostat --cov-report=term-missing --cov-fail-under=95
      - name: Check code quality
        run: ruff check custom_components/price_aware_thermostat tests/integration benchmarks tests/test_benchmark.py

      - name: Strict type checking
        run: mypy custom_components/price_aware_thermostat

name: Home Assistant compatibility

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  import-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install current Home Assistant
        run: python -m pip install "homeassistant==2026.11.1"
      - name: Compile the integration
        run: python -m compileall -q custom_components/price_aware_thermostat
      - name: Import integration modules against actual Home Assistant
        run: |
          python - <<'PY'
          from custom_components.price_aware_thermostat import async_setup_entry
          from custom_components.price_aware_thermostat.config_flow import PriceAwareThermostatConfigFlow
          from custom_components.price_aware_thermostat.climate import PriceAwareThermostat
          from custom_components.price_aware_thermostat.coordinator import NordPoolPriceCoordinator
          print("Home Assistant import smoke checks passed")
          PY
